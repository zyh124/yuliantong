{% extends "base.html" %}
{% block title %}登录 - 渔链通{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header"><h2>登录渔链通</h2><p>水产品数字化营销与供应链信息管理系统</p></div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="POST" class="auth-form">
            <div class="form-group"><label>用户名</label><input type="text" name="username" required></div>
            <div class="form-group"><label>密码</label><input type="password" name="password" required></div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="auth-footer"><p>Flask 原型 &middot; 测试账号 admin / admin123</p></div>
    </div>
</div>
{% endblock %}
