{% extends "base.html" %}{% block title %}企业信息{% endblock %}
{% block content %}
<div class="dashboard-layout">
{% include "includes/buyer_sidebar.html" %}
<div class="dashboard-body"><div class="page-header"><h1>企业信息</h1></div>{% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
<div class="chart-box"><h3>基本信息</h3>
    <form method="POST">
        <div class="form-row"><div class="form-group"><label>企业名称</label><input type="text" name="company_name" value="{{ user.company_name or '' }}"></div><div class="form-group"><label>联系人</label><input type="text" name="contact_name" value="{{ user.contact_name or '' }}"></div></div>
        <div class="form-row"><div class="form-group"><label>手机号</label><input type="text" name="phone" value="{{ user.phone or '' }}"></div><div class="form-group"><label>邮箱</label><input type="email" name="email" value="{{ user.email or '' }}"></div></div>
        <div class="form-group"><label>地址</label><input type="text" name="address" value="{{ user.address or '' }}"></div>
        <button type="submit" class="btn btn-primary">保存</button></form>
</div></div></div>
{% endblock %}
